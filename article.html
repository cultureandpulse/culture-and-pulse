<!DOCTYPE html>
<html>
<head>
  <title>Article - Culture & Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="nav">
  <div><strong>Culture & Pulse</strong></div>
  <div>
    <a href="index.html">Home</a>
    <a href="sports.html">Sports</a>
    <a href="did-you-know.html">Did You Know</a>
    <a href="pulse-check.html">Pulse Check</a>
    <a href="culture-drop.html">Culture Drop</a>
  </div>
</div>

<div class="section">
  <div id="article">Loading article...</div>
</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/14jm-TllzOtrlOJIteOqteYquXLwho5M4d4ESjRcGchg/gviz/tq?tqx=out:json";

// Get ID from URL (?id=wnba1)
const params = new URLSearchParams(window.location.search);
const articleId = params.get("id");

fetch(sheetURL)
  .then(res => res.text())
  .then(data => {

    const json = JSON.parse(data.substr(47).slice(0, -2));
    const rows = json.table.rows;

    let article = null;

    rows.forEach(r => {
      const id = r.c[0]?.v;

      if (id === articleId) {
        article = {
          title: r.c[1]?.v,
          category: r.c[2]?.v,
          image: r.c[3]?.v,
          excerpt: r.c[4]?.v
        };
      }
    });

    if (!article) {
      document.getElementById("article").innerHTML =
        "<div class='card'>Article not found.</div>";
      return;
    }

    document.getElementById("article").innerHTML = `
      <div class="card">

        <div class="tag">${article.category}</div>

        <h1>${article.title}</h1>

        <img src="${article.image}" />

        <p>${article.excerpt}</p>

      </div>
    `;
  })
  .catch(err => {
    document.getElementById("article").innerHTML =
      "<div class='card'>Error loading article.</div>";
  });
</script>

</body>
</html>
