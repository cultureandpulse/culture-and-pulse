<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/14jm-TllzOtrlOJIteOqteYquXLwho5M4d4ESjRcGchg/gviz/tq?tqx=out:json";

fetch(sheetURL)
  .then(res => res.text())
  .then(data => {

    const json = JSON.parse(data.substr(47).slice(0, -2));
    const rows = json.table.rows;

    let html = "";

    rows.forEach(r => {
      const title = r.c[1]?.v || "";
      const category = r.c[2]?.v || "";
      const excerpt = r.c[4]?.v || "";
      const link = r.c[5]?.v || "#";

      html += `
        <a href="${link}">
          <div class="feed-item">
            <strong>[${category}]</strong> ${title}
            <br/>
            <small>${excerpt}</small>
          </div>
        </a>
      `;
    });

    document.getElementById("feed").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("feed").innerHTML =
      "<div class='feed-item'>Feed loading error — check sheet sharing settings</div>";
  });
</script>
